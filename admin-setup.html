<!DOCTYPE html>
<html>
<head>
    <title>Admin Setup</title>
    <style>
        body { font-family: Arial; max-width: 600px; margin: 50px auto; }
        input { width: 100%; padding: 10px; margin: 10px 0; }
        button { padding: 10px 20px; background: #0066cc; color: white; border: none; cursor: pointer; }
        button:hover { background: #0052a3; }
        #result { margin-top: 20px; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <h1>Create Admin User</h1>
    
    <div>
        <label>Name:</label>
        <input type="text" id="name" value="Administrator">
        
        <label>Email:</label>
        <input type="email" id="email" value="admin@quickbite.com">
        
        <label>Password:</label>
        <input type="password" id="password" value="Admin@123">
        
        <label>University ID:</label>
        <input type="text" id="universityId" value="ADMIN001">
        
        <button onclick="createAdmin()">Create Admin</button>
    </div>
    
    <div id="result"></div>

    <script>
        async function createAdmin() {
            const result = document.getElementById('result');
            result.innerHTML = 'Creating admin...';
            
            try {
                const response = await fetch('http://localhost:5000/api/auth/setup-admin', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: document.getElementById('name').value,
                        email: document.getElementById('email').value,
                        password: document.getElementById('password').value,
                        universityId: document.getElementById('universityId').value
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    result.className = 'success';
                    result.innerHTML = `
                        <h3>✅ Admin Created Successfully!</h3>
                        <p><strong>Message:</strong> ${data.message}</p>
                        <p><strong>Email:</strong> ${data.user.email}</p>
                        <p><strong>Role:</strong> ${data.user.role}</p>
                        <p><strong>Token:</strong> ${data.token.substring(0, 50)}...</p>
                        <hr>
                        <p>Now go to <a href="http://localhost:3000/login" target="_blank">Login Page</a></p>
                        <p>Use: <strong>${data.user.email}</strong> / <strong>Admin@123</strong></p>
                    `;
                } else {
                    result.className = 'error';
                    result.innerHTML = `
                        <h3>❌ Error</h3>
                        <p>${data.error}</p>
                    `;
                }
            } catch (error) {
                result.className = 'error';
                result.innerHTML = `
                    <h3>❌ Request Failed</h3>
                    <p>${error.message}</p>
                    <p>Make sure backend is running on http://localhost:5000</p>
                `;
            }
        }
    </script>
</body>
</html>
